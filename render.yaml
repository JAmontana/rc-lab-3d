# Despliegue de RC LAB 3D en Render (plan Free).
# Render inyecta la variable PORT; Uvicorn debe escuchar en 0.0.0.0.
services:
  - type: web
    name: rc-lab-3d
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PYTHONUNBUFFERED
        value: "1"
